<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Anywhere - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Subtitle Anywhere Settings</h1>

    <!-- Server Section -->
    <section class="section">
      <h2>Server</h2>
      <div class="field">
        <label for="wsUrl">WebSocket URL</label>
        <input type="text" id="wsUrl" placeholder="ws://127.0.0.1:10095">
      </div>
    </section>

    <!-- Translation Section -->
    <section class="section">
      <h2>Translation</h2>
      <div class="field">
        <label for="targetLang">Target Language</label>
        <select id="targetLang">
          <option value="none">Disabled</option>
          <option value="en">English</option>
          <option value="zh">Chinese (中文)</option>
          <option value="ja">Japanese (日本語)</option>
          <option value="ko">Korean (한국어)</option>
          <option value="fr">French (Français)</option>
          <option value="de">German (Deutsch)</option>
          <option value="es">Spanish (Español)</option>
          <option value="pt">Portuguese (Português)</option>
          <option value="ru">Russian (Русский)</option>
          <option value="ar">Arabic (العربية)</option>
          <option value="hi">Hindi (हिन्दी)</option>
          <option value="th">Thai (ไทย)</option>
          <option value="vi">Vietnamese (Tiếng Việt)</option>
          <option value="it">Italian (Italiano)</option>
        </select>
      </div>
    </section>

    <!-- Appearance Section -->
    <section class="section">
      <h2>Appearance</h2>
      <div class="field">
        <label for="fontFamily">Font Family</label>
        <input type="text" id="fontFamily" placeholder="system-ui, sans-serif">
      </div>
      <div class="field">
        <label for="fontSizeOpt">Font Size: <span id="fontSizeOptValue">20</span>px</label>
        <input type="range" id="fontSizeOpt" min="12" max="36" value="20">
        <div class="preview" id="fontPreview" style="font-size: 20px;">
          Sample subtitle text
        </div>
      </div>
      <div class="field">
        <label for="textColor">Text Color</label>
        <input type="color" id="textColor" value="#ffffff">
      </div>
      <div class="field">
        <label for="bgOpacity">Background Opacity: <span id="bgOpacityValue">0.6</span></label>
        <input type="range" id="bgOpacity" min="0" max="1" step="0.05" value="0.6">
      </div>
      <div class="field">
        <label for="verticalPosition">Vertical Position (bottom offset): <span id="verticalPositionValue">10</span>%</label>
        <input type="range" id="verticalPosition" min="0" max="50" value="10">
      </div>
      <div class="field">
        <label for="maxLines">Max Lines: <span id="maxLinesValue">2</span></label>
        <input type="range" id="maxLines" min="1" max="4" value="2">
      </div>
      <div class="field">
        <label for="fadeTimeout">Fade Timeout: <span id="fadeTimeoutValue">5</span>s</label>
        <input type="range" id="fadeTimeout" min="1" max="15" value="5">
      </div>
    </section>

    <div class="actions">
      <button class="save-btn" id="saveBtn">Save Settings</button>
      <span class="saved-notice" id="savedNotice">Saved!</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
